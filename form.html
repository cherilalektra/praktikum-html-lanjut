<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <title>Form Registrasi</title>
</head>

<body>

    <h1>Form Registrasi</h1>

    <form action="#" method="post">

        <fieldset>
            <legend>Biodata</legend>

            <p>
                <label>Nama Mahasiswa</label>
                :
                <input type="text" name="nama" placeholder="Nama Anda">
            </p>

            <p>
                <label>No Induk Mahasiswa (NIM)</label>
                :
                <input type="text" name="nim" placeholder="123456789">
            </p>

            <p>
                <label>Alamat Mahasiswa</label>
                :
                <textarea name="alamat" rows="5" cols="30"
                    placeholder="Alamat Anda"></textarea>
            </p>

            <p>
                <label>Tanggal Lahir</label>
                :
                <select name="tanggal">
                    <option>01</option>
                    <option>02</option>
                    <option>03</option>
                    <option>04</option>
                    <option>05</option>
                </select>

                <select name="bulan">
                    <option>Januari</option>
                    <option>Februari</option>
                    <option>Maret</option>
                    <option>April</option>
                    <option>Mei</option>
                    <option>Juni</option>
                    <option>Juli</option>
                    <option>Agustus</option>
                    <option>September</option>
                    <option>Oktober</option>
                    <option>November</option>
                    <option>Desember</option>
                </select>

                <select name="tahun">
                    <option>1990</option>
                    <option>1991</option>
                    <option>1992</option>
                    <option>1993</option>
                    <option>1994</option>
                    <option>1995</option>
                </select>
            </p>

            <p>
                <label>Jenis Kelamin</label>
                :
                <input type="radio" name="gender" value="pria" checked>
                Pria

                <input type="radio" name="gender" value="wanita">
                Wanita
            </p>

            <p>
                <label>Upload Foto</label>
                :
                <input type="file" name="foto">
            </p>

            <p>
                <label>URL Website</label>
                :
                <input type="url" name="website"
                    placeholder="URL Website Anda">
            </p>

            <p>
                <label>Perguruan Tinggi</label>
                :
                <input type="text" name="kampus">
            </p>

        </fieldset>


        <br>


        <fieldset>
            <legend>Info Akun</legend>

            <p>
                <label>Email</label>
                :
                <input type="email" name="email"
                    placeholder="Email Anda">
            </p>

            <p>
                <label>Username</label>
                :
                <input type="text" name="username"
                    placeholder="Username Anda">
            </p>

            <p>
                <label>Password</label>
                :
                <input type="password" name="password"
                    placeholder="Password Anda">
            </p>

            <p>
                <label>Ulangi Password</label>
                :
                <input type="password" name="ulangipassword"
                    placeholder="Password Anda">
            </p>

        </fieldset>


        <br>


        <fieldset>
            <legend>Kemampuan Dasar</legend>

            <input type="checkbox" name="skill" value="HTML">
            HTML

            <input type="checkbox" name="skill" value="CSS">
            CSS

            <input type="checkbox" name="skill" value="Javascript">
            Javascript

            <input type="checkbox" name="skill" value="PHP">
            PHP

            <input type="checkbox" name="skill" value="MySQL">
            MySQL

            <input type="checkbox" name="skill" value="Laravel">
            Laravel

            <input type="checkbox" name="skill" value="React Native">
            React Native

        </fieldset>


        <br>

        <input type="reset" value="Reset">
        <input type="submit" value="Simpan">
        <input type="button" value="Button">

    </form>

</body>

</html>
